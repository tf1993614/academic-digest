[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-digest"
version = "0.1.0"
description = "Deterministic collection and delivery for a daily Chinese academic report"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "PyMuPDF>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1.8", "pyflakes>=3.0"]

[project.scripts]
academic-digest = "academic_digest.cli:main"

[tool.setuptools]
# The package ships inside the skill so a copied skill directory is self-contained;
# the repository is only one place that skill can live.
package-dir = {"" = "skills/academic-digest"}
packages = ["academic_digest", "academic_digest.fulltext", "academic_digest.sources"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
disallow_untyped_defs = true
check_untyped_defs = true
