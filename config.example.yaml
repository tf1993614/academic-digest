timezone: Asia/Shanghai

# How far back each source looks when a scheduled run is late.
# arXiv must look back at least 4 days: Friday-Monday submissions are
# announced as one batch, and a shorter window loses the weekend.
lookback:
  pubmed: 2
  europepmc: 2
  arxiv: 4
  researchsquare: 3
  biorxiv: 2
  medrxiv: 2

# Keyword groups. Each paper enters the candidate pool under the group with
# the highest weighted hit score (title hits weigh three times an abstract hit).
# `max_items` caps that group in the candidate pool, and every non-empty group
# keeps at least its best paper even when a broader group has the top scores.
# Omit `max_items` to use the default of 6.
topics:
  - name: G1
    label: 老化 × 多组学
    terms:
      - aging
      - ageing
      - senescence
      - multi-omics
      - multiomics
      - single-cell multi-omics
    exclude: []
    max_items: 6
  - name: G2
    label: 单细胞与空间组学
    terms:
      - single-cell
      - scRNA-seq
      - spatial transcriptomics
      - MERFISH
      - in situ amplification
      - isoform-resolved
      - CITE-seq
      - RNA-protein co-assay
      - cell-cell communication
    exclude: []
    max_items: 4

sources:
  pubmed: true
  europepmc: true
  arxiv: true
  researchsquare: true
  # bioRxiv/medRxiv pull every record in the date range and filter locally,
  # so they stay off unless a run needs full coverage.
  biorxiv: false
  medrxiv: false

# arXiv RSS feeds to read. One request per category, three seconds apart.
arxiv:
  categories:
    - cs.LG
    - cs.AI
    - cs.CL
    - q-bio.QM
    - q-bio.GN
    - q-bio.MN

# Candidate pool cap; it must be at least the number of topics so every
# non-empty group can keep a paper. A short pool is never padded.
pool:
  max_items: 30

# Relative to this file's directory.
paths:
  state_db: state/academic-digest.sqlite3
  candidates: out/candidates.json
