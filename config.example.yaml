timezone: Asia/Shanghai

# Optional journal whitelist. An empty list (or omitting the key) means every
# journal is allowed. When set, PubMed appends `"<name>"[Journal]` and Europe
# PMC appends `JOURNAL:"<name>"` to their queries, and a candidate whose venue
# matches one of the names (case-insensitive, whitespace-normalized) gets +2 to
# its ranking score. Names are full journal titles as the sources report them;
# the Nature Index journal list is a convenient reference:
# https://www.nature.com/nature-index/faq
# PubMed may need special characters such as parentheses or `&` removed from a
# title; adjust that one entry if a journal returns no hits.
# The list is intentionally user-supplied: do not scrape journal websites.
journal_filter: []

# How far back each source looks when a scheduled run is late.
# arXiv must look back at least 4 days: Friday-Monday submissions are
# announced as one batch, and a shorter window loses the weekend.
lookback:
  pubmed: 2
  europepmc: 2
  arxiv: 4
  researchsquare: 3
  biorxiv: 2
  medrxiv: 2

# Keyword groups. Each paper enters the candidate pool under the group with
# the highest weighted hit score (title hits weigh three times an abstract hit).
# `max_items` caps that group in the candidate pool, and every non-empty group
# keeps at least its best paper even when a broader group has the top scores.
# Omit `max_items` to use the default of 6.
#
# G6 is the independent "AI 工具 / Agent Harness" block: it feeds the G6
# section of the digest and never takes a 3 + 7 paper slot.
topics:
  - name: G1
    label: 老化 × 多组学
    terms:
      - aging
      - ageing
      - senescence
      - multi-omics
      - multiomics
      - single-cell multi-omics
    exclude: []
    max_items: 6
  - name: G2
    label: 单细胞与空间组学
    terms:
      - single-cell
      - scRNA-seq
      - spatial transcriptomics
      - MERFISH
      - in situ amplification
      - isoform-resolved
      - CITE-seq
      - RNA-protein co-assay
      - cell-cell communication
    exclude: []
    max_items: 4
  - name: G3
    label: 单细胞基础模型与表征
    terms:
      - single-cell foundation model
      - CellVQ
      - vector quantization
      - cell encoding
      - cell type annotation
      - protein imputation
      - virtual cell
      - batch effect correction
      - interpretability
      - explainability
    exclude: []
    max_items: 6
  - name: G4
    label: 扰动预测与基因调控
    terms:
      - perturbation prediction
      - genetic perturbation
      - gene regulatory network
      - GRN
      - master regulator
      - zero-shot
    exclude: []
    max_items: 6
  - name: G5
    label: LLM / 图 / 多模态
    terms:
      - LLM
      - LLMs
      - large language model
      - multimodal foundation model
      - multimodal learning
      - knowledge graph
      - graph knowledge network
      - retrieval-augmented
      - reasoning
      - GNN
      - ESM-2
      - GraphRAG
      - Graph-Native
    exclude: []
    max_items: 6
  - name: G6
    label: AI 工具 / Agent Harness
    terms:
      - Claude Code
      - Codex
      - DeepSeek Harness
      - DSH harness
      - DSH
      - agent harness
      - coding agent
    exclude: []
    max_items: 2

sources:
  pubmed: true
  europepmc: true
  arxiv: true
  researchsquare: true
  # bioRxiv/medRxiv pull every record in the date range and filter locally,
  # so they stay off unless a run needs full coverage.
  biorxiv: false
  medrxiv: false
  # GitHub discovery needs a token in the environment named by
  # `github.token_env` below; config validation rejects an enabled source
  # without it. Turn it off only if you do not want the GitHub and AI-tool
  # blocks in the digest. A credential-free fixture demo can use
  # tests/fixtures/walking/config.yaml instead.
  github: true

# arXiv RSS feeds to read. One request per category, three seconds apart.
arxiv:
  categories:
    - cs.LG
    - cs.AI
    - cs.CL
    - q-bio.QM
    - q-bio.GN
    - q-bio.MN

# OA full text for the digest's "今日必读" papers. Unpaywall's API requires a
# contact email; leave it empty to skip Unpaywall and rely on Europe PMC,
# arXiv, and the preprint PDFs.
fulltext:
  unpaywall:
    email: ""

# GitHub repository discovery. The 22 G1-G5 discovery queries and the 12
# Claude Code / Codex / DSH queries are the defaults; omit `queries` and
# `g6_queries` to use them. Set `user` to your GitHub login to track the
# releases of the repositories you have starred. The official G6 repositories
# feed the AI-tool block; a repository that is also starred is read once and
# appears only there.
github:
  token_env: GITHUB_TOKEN
  user: tf1993614
  official:
    - anthropics/claude-code
    - openai/codex
    - deepseek-ai/deepseek-harness
  releases:
    days: 7
    max_items: 2
  g6_topic: G6
  new:
    days: 7
    min_stars: 5
    max_items: 1
  active:
    days: 7
    min_stars: 30
    max_items: 2
  g6:
    max_items: 2
  readme_limit: 20
  # Override a group's server-side queries only when the defaults do not fit.
  # queries:
  #   G2:
  #     - topic:single-cell
  #     - '"spatial transcriptomics" in:name,description,readme'
  # g6_queries:
  #   - topic:claude-code
  #   - '"deepseek harness" in:name,description,readme'

# Candidate pool cap; it must be at least the number of topics so every
# non-empty group can keep a paper. A short pool is never padded.
pool:
  max_items: 30

# Server酱 delivery. Every field is optional; the values below are the defaults.
# The SendKey is never stored here: a live `push` reads it from the environment
# variable named by `sendkey_env`. `push --dry-run` and `push --fixtures` do not
# need it. Titles are limited to `title_max` Unicode characters; a body longer
# than `split_bytes` is split on `## ` section boundaries into at most
# `max_messages` messages of at most `max_bytes` UTF-8 bytes. Failed sends are
# retried `retries` times with exponential backoff and then stored in `pending`,
# which the next live run retries once. Pending digests whose `created_at` is
# more than `pending_days` calendar days old are dropped. `send_empty: true`
# sends a short notice on a quiet day; set it to false to stay silent.
# push:
#   sendkey_env: SERVERCHAN_SENDKEY
#   channel: serverchan
#   send_empty: true
#   split_bytes: 30000
#   max_bytes: 32768
#   max_messages: 2
#   title_max: 32
#   retries: 2
#   backoff_seconds: 1
#   timeout: 30
#   pending_days: 2

# Relative to this file's directory.
paths:
  state_db: state/academic-digest.sqlite3
  candidates: out/candidates.json
